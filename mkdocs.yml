site_name: pyMachDM
site_description: Advanced Data Mechanics & Machine Learning Framework
site_author: Deepanshu Yadav | Michigan State University
site_url: https://deepanshuIITM.github.io/pyMachDM/

repo_name: Source Code
repo_url: https://github.com/deepanshuIITM/pyMachDM/

theme:
  name: material
  language: en
  generator: false   

  # ADD THESE TWO LINES TO OVERRIDE THE DEFAULT ICONS
  logo: assets/images/logo1.png        # Replaces the graduation cap in the top bar
  favicon: assets/images/logo1.png  # Replaces the icon shown in the browser tab

  features:
    - navigation.tabs          # Top horizontal bar menu items
    - navigation.tabs.sticky   # Pins top bar while scrolling
    - navigation.top           # Back to top button arrow
    - navigation.tracking      # Highlights right sidebar headings dynamically
    - navigation.expand        # Forces left sidebar sections to stay expanded
    - navigation.footer        # <-- CRITICAL: Automatically builds crisp "Previous" and "Next" buttons at the bottom
    - content.code.copy # Enables the nice copy button on your pip install code blocks

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo        
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light Mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate            
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark Mode

  font:
    text: Roboto
    code: Roboto Mono

extra_css:
  - stylesheets/extra.css

# ADD THIS BLOCK TO ENERGIZE LATEX MATH CODES NATIVELY
extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/MathJax.js?config=TeX-AMS-MML_HTMLorMML

markdown_extensions:
  - attr_list          # Allows us to add custom CSS classes to markdown
  - md_in_html         # Permits markdown processing inside raw HTML blocks
  - pymdownx.emoji:    # Enables icons (like the megaphone and chess piece)
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_style: material
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:        
      generic: true
  - admonition                 

copyright: >
  Copyright &copy; 2026 Deepanshu Yadav | COIN Lab | Michigan State University. All rights reserved.
  <span style="margin-left: 15px;">
    <a href="https://github.com/deepanshuIITM/pyMachDM" target="_blank"><img src="https://img.shields.io/badge/version-1.0.0-blue.svg" style="vertical-align: middle;" alt="Version"></a>
    <a href="https://opensource.org/licenses/MIT" target="_blank"><img src="https://img.shields.io/badge/License-MIT-yellow.svg" style="vertical-align: middle; margin-left: 5px;" alt="License"></a>
  </span>

plugins:
  - search
  - mkdocs-jupyter

docs_dir: docs

# NESTED NAVIGATION: Creates clean sub-levels and sub-sub-levels in the left menu
nav:
  - Home: 
      - Overview: index.md
      - Key Features: home/features.md
      - Quick Start: home/quickstart.md

  - Installation:
      - Setup Guide: installation/setup.md
      - Configuration:
          - Requirements: installation/requirements.md
          - Installation Steps: installation/steps.md
      - Troubleshooting: installation/troubleshooting.md
      
  - Interactive MCDMs:
      - Overview: imcdm/overview.md
      - Preference Elicitation:
          - Objective Class: imcdm/preferences/obj_class.md
          - Bounding Parameters: imcdm/preferences/bounding_params.md
          - Reference Points: imcdm/preferences/reference_points.md
          - Reference Directions: imcdm/preferences/reference_directions.md
          - Intermediate Solutions: imcdm/preferences/intermediate_solns.md
      - Scalarization Methods: imcdm/scalarization.md
      - iMCDM Methods:
          - GUESS: imcdm/methods/guess.md
          - STEM: imcdm/methods/stem.md
          - STOM: imcdm/methods/stom.md
          - NIMBUS: imcdm/methods/nimbus.md
      
  - Machine-DM: 
      - Overview: mach-dm/machdm.md
      - Class Predictor ANN: mach-dm/class_predictor.md
      - Parameter Predictor ANN: mach-dm/parameter_predictor.md
      - Preference Evaluator Metric: mach-dm/preference_evaluator.md

  - Bench-iMCDM:
      - Overview: bench-imcdm/overview.md
      - Benchmark Problems: 
          - Problem Information: bench-imcdm/problems/bench_probs.md
          - DTLZ7: bench-imcdm/problems/dtlz.md
      - Pretrained ANNs: bench-imcdm/pretrained.md
      - Performance Metrics: bench-imcdm/metrics.md

  - Visualization: visualization.md

  - Tutorials: 
      - Overview: tutorials/tutorials.md
      - Core Idea: tutorials/core_idea.md
      - Demo: tutorials/demo.md
      - Sandbox Notebook: tutorials/live_script.md
  - References: references.md