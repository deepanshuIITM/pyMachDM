site_name: pyMachDM
site_description: Advanced Data Mechanics & Machine Learning Framework
site_author: Deepanshu Kumar | Michigan State University
site_url: https://deepanshuIITM.github.io/pyMachDM

repo_name: Source Code
repo_url: https://github.com/deepanshuIITM/pyMachDM

theme:
  name: material
  language: en
  
  features:
    - navigation.tabs          # Top horizontal header menu
    - navigation.tabs.sticky   # Keeps top header pinned
    - navigation.top           # Smooth back to top button
    - navigation.indexes       # Clicking a top option links cleanly to its sections

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo          
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light Mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate            
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark Mode

  font:
    text: Roboto
    code: Roboto Mono

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:        
      generic: true
  - admonition                 

nav:
  - Home: index.md
  - Installation: installation.md
  - Tutorials: tutorials.md
  - Theory & Citations: theory.md